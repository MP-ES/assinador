name: Pull Request

on:
  pull_request:
    branches:
      - main
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # --ignore-scripts pula o postinstall (recompilação nativa do pkcs11js):
      # lint e build do bundle não precisam do módulo nativo (graphene-pk11 e
      # pkcs11js são marcados como external no build do main).
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
