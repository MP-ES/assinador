name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - v*
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest # Apple Silicon (arm64) — gera o dmg nativo, sem Rosetta
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci roda o postinstall (electron-builder install-app-deps), que
      # recompila o módulo nativo pkcs11js para o Electron alvo. Os runners
      # windows-latest e macos-latest já trazem o toolchain de build nativo
      # (não é mais necessário windows-build-tools nem cross-env).
      - run: npm ci

      # Em tag (v*): build + publish no GitHub Releases (alimenta o auto-updater).
      # Em push/dispatch: build sem publicar (os artefatos são enviados abaixo).
      - name: Build e empacotar
        run: npm run build && npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Assinatura/notarização macOS — preencher quando houver Developer ID:
          # CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Em builds que não são de tag, disponibiliza os instaladores para download
      # (permite baixar o dmg/exe para testar sem precisar publicar uma release).
      - name: Publicar artefatos do build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: assinador-${{ matrix.os }}
          path: |
            installer/*.exe
            installer/*.dmg
            installer/*.yml
          if-no-files-found: ignore
