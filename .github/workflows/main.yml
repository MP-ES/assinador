name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - v*
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest # Apple Silicon (arm64) — gera o dmg nativo, sem Rosetta
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci roda o postinstall (electron-builder install-app-deps), que
      # recompila o módulo nativo pkcs11js para o Electron alvo. Os runners
      # windows-latest e macos-latest já trazem o toolchain de build nativo
      # (não é mais necessário windows-build-tools nem cross-env).
      - run: npm ci

      # Sempre builda SEM publicar. A publicação da release é feita num job único
      # (release) para evitar a corrida em que macOS e Windows criam rascunhos
      # separados no GitHub (electron-builder não encontra o rascunho do outro job
      # pela tag). O electron-builder gera também os latest*.yml do auto-updater
      # em installer/ mesmo com --publish never.
      #
      # Assinatura/notarização macOS: quando houver Developer ID, adicionar um
      # bloco `env:` aqui com CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID,
      # APPLE_APP_SPECIFIC_PASSWORD e APPLE_TEAM_ID (via secrets).
      - name: Build e empacotar
        run: npm run build && npx electron-builder --publish never

      # Instaladores + metadados de update ficam disponíveis para o job de release
      # e também para download direto (testar sem publicar release).
      - name: Subir instaladores como artifact
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ matrix.os }}
          path: |
            installer/*.exe
            installer/*.dmg
            installer/*.zip
            installer/*.yml
            installer/*.blockmap
            !installer/builder-debug.yml
          if-no-files-found: ignore

  # Só em tag (v*): junta os instaladores dos dois SOs e cria UMA release.
  # prerelease é ligado automaticamente quando a tag tem sufixo (ex.: v5.0.0-beta).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar instaladores dos dois SOs
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: instaladores-*
          merge-multiple: true

      - name: Criar/atualizar a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ github.ref_name }}"
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease";; esac
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" dist/* \
              --repo "${{ github.repository }}" \
              --title "$tag" \
              --generate-notes \
              $prerelease
          fi
